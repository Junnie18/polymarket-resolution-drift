[project]
name = "polydrift"
version = "0.1.0"
description = "Resolution-boundary drift analysis for Polymarket"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "numpy>=1.24",
    "python-dateutil>=2.8",
    "tenacity>=8.2",
    "pyarrow>=14.0",
    "matplotlib>=3.7",
]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]
